[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "A local demo of evidence-driven task delivery"
requires-python = ">=3.11"

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.runbooks"]
package-dir = { harness = "src/harness", "harness.runbooks" = "examples/runbooks" }

[tool.setuptools.package-data]
"harness.runbooks" = ["*.toml"]
