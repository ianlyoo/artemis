[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-harness"
version = "0.2.0"
description = "Talk to one lead agent while many coding agents work in parallel; you are asked only for real decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICES.md"]

[project.scripts]
artemis = "artemis.cli:main"

[tool.setuptools]
packages = ["artemis", "artemis.templates"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"artemis.templates" = ["*.toml", "*.md"]
