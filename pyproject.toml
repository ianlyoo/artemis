[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis-harness"
dynamic = ["version"]   # artemis.__version__, the one place it is written
description = "A personal agent system on your own computer: one lead you talk to, a team of agents from several vendors, a secret vault, and an app for any browser."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICES.md", "THIRD_PARTY_NOTICES"]
dependencies = [
    "cryptography>=43",
    "keyring>=25",
    "segno>=1.6",
]

[project.scripts]
artemis = "artemis.cli:main"

[tool.setuptools]
packages = ["artemis", "artemis.templates", "artemis.web"]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "artemis.__version__" }

[tool.setuptools.package-data]
"artemis.templates" = ["*.toml", "*.md"]
"artemis.web" = ["client.js", "app/**/*"]
