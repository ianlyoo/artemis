<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504.2" width="360" height="504.2" role="img" aria-label="One sentence goes to the lead, which splits it into three tasks with checks and holds back the release note because it speaks for you. Three mock workers run at once while the status line counts them down. One decision card waits for you; you approve it. The digest then says that three tasks shipped to main and you were asked once."><style>g.r{animation:a .35s ease-out both}@keyframes a{from{opacity:0}}.d0{animation-delay:0.6s}.d1{animation-delay:0.88s}.d2{animation-delay:1.16s}.d3{animation-delay:1.44s}.d4{animation-delay:1.72s}.d5{animation-delay:2s}.d6{animation-delay:2.28s}.d7{animation-delay:2.56s}.d8{animation-delay:2.84s}.d9{animation-delay:3.12s}.d10{animation-delay:3.4s}@media (prefers-reduced-motion:reduce){g.r{animation:none}}</style><rect x="0.5" y="0.5" width="359" height="503.2" rx="12" fill="#14181d" stroke="#30363d" stroke-width="1"/><text x="26.45" y="29.32" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" xml:space="preserve">$</text><text x="41.4" y="29.32" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" xml:space="preserve">artemis demo</text><text x="333.55" y="29.32" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.89" text-anchor="end" xml:space="preserve">mock ×3</text><rect x="26.45" y="41.4" width="307.1" height="1" fill="#2b323a"/><g class="r d0"><text x="26.45" y="64.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">you › </tspan><tspan fill="#e6edf3">Add a --json flag and a --done filter,</tspan></text><text x="26.45" y="82.4" font-family="ui-monospace,SFMon