<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747.8" width="900" height="747.8" role="img" aria-label="One sentence goes to the lead, which splits it into three tasks with checks and holds back the release note because it speaks for you. Three mock workers run at once while the status line counts them down. One decision card waits for you; you approve it. The digest then says that three tasks shipped to main and you were asked once."><style>g.r{animation:a .35s ease-out both}@keyframes a{from{opacity:0}}.d0{animation-delay:0.6s}.d1{animation-delay:0.88s}.d2{animation-delay:1.16s}.d3{animation-delay:1.44s}.d4{animation-delay:1.72s}.d5{animation-delay:2s}.d6{animation-delay:2.28s}.d7{animation-delay:2.56s}.d8{animation-delay:2.84s}.d9{animation-delay:3.12s}.d10{animation-delay:3.4s}.d11{animation-delay:3.68s}.d12{animation-delay:3.96s}.d13{animation-delay:4.24s}.d14{animation-delay:4.52s}@media (prefers-reduced-motion:reduce){g.r{animation:none}}</style><rect x="0.5" y="0.5" width="899" height="746.8" rx="12" fill="#14181d" stroke="#30363d" stroke-width="1"/><text x="32.2" y="35.7" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve">$</text><text x="50.4" y="35.7" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" xml:space="preserve">artemis demo</text><text x="867.8" y="35.7" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.04" text-anchor="end" xml:space="preserve">project artemis-demo · lead: chat · workers: mock ×3 (no AI; for trying the flow)</text><rect x="32.2" y="50.4" width="835.6" height="1" fill="#2b323a"/><g class="r d0"><text x="32.2" y="78.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">you › </tspan><tspan fill="#e6edf3">Add a --json flag and a --done filter, document both in the README, then post a release</tspan></text><text x="32.2" y="100.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">      note to the team.</tspan></text></g><g class="r d1"><text x="32.2" y="122.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e" font-weight="700">lead (mock) › </tspan><tspan fill="#e6edf3">Three tasks, running in parallel:</tspan></text><text x="32.2" y="144.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  #1 Add a --json flag            check: python3 -m unittest</tspan></text><text x="32.2" y="166.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  #2 Add a --done filter          check: python3 -m unittest</tspan></text><text x="32.2" y="188.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  #3 Document both in the README  check: README mentions --json, README mentions --done</tspan></text><text x="32.2" y="210.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  Post a release note to the team — it speaks in your name, so it waits in your inbox</tspan></text><text x="32.2" y="232.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">    (decision 1).</tspan></text></g><g class="r d2"><text x="32.2" y="254.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">● </tspan><tspan fill="#8b949e">3 running · 1 decision for you · asked you 1× · 0 done</tspan></text></g><g class="r d3"><text x="32.2" y="276.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">● </tspan><tspan fill="#8b949e">2 running · 1 decision for you · asked you 1× · 1 done</tspan></text></g><g class="r d4"><text x="32.2" y="298.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">● </tspan><tspan fill="#8b949e">1 running · 1 decision for you · asked you 1× · 2 done</tspan></text></g><g class="r d5"><text x="32.2" y="320.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">● </tspan><tspan fill="#8b949e">0 running · 1 decision for you · asked you 1× · 3 done</tspan></text></g><g class="r d6"><rect x="19.6" y="327.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="342.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e3b341" font-weight="700">Decision 1 · send as you</tspan></text><rect x="19.6" y="349.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="364.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  Post a release note to the team</tspan></text><rect x="19.6" y="371.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="386.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  Why you: it speaks in your name.</tspan></text><rect x="19.6" y="393.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="408.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">  If you do nothing: nothing happens.</tspan></text><rect x="19.6" y="415.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="430.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">  Ready because: tasks #1–#3 shipped, checks green on main dd72f65.</tspan></text><rect x="19.6" y="437.7" width="3" height="22" fill="#e3b341"/><text x="32.2" y="452.4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">  artemis approve 1   ·   artemis decline 1</tspan></text></g><g class="r d7"><text x="32.2" y="484.3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">you › </tspan><tspan fill="#e6edf3">artemis approve 1</tspan></text><text x="32.2" y="506.3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">approved: 1 · the lead carries it out</tspan></text></g><g class="r d8"><text x="32.2" y="528.3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e" font-weight="700">lead (mock) › </tspan><tspan fill="#e6edf3">Decision 1: posted to the demo outbox (outbox/team.md; nothing left this</tspan></text><text x="32.2" y="550.3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">      machine).</tspan></text></g><g class="r d9"><text x="32.2" y="582.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">you › </tspan><tspan fill="#e6edf3">artemis digest</tspan></text></g><g class="r d10"><text x="32.2" y="604.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Last under a minute · 3 tasks done · asked you 1× · nothing stuck</tspan></text></g><g class="r d11"><text x="32.2" y="626.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">shipped   </tspan><tspan fill="#e6edf3">#1 Add a --json flag            main 2d1c61c · python3 -m unittest exit 0</tspan></text></g><g class="r d12"><text x="32.2" y="648.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">shipped   </tspan><tspan fill="#e6edf3">#2 Add a --done filter          main 02446a5 · python3 -m unittest exit 0</tspan></text></g><g class="r d13"><text x="32.2" y="670.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#56d364" font-weight="700">shipped   </tspan><tspan fill="#e6edf3">#3 Document both in the README  main dd72f65 · README mentions --json, --done</tspan></text></g><g class="r d14"><text x="32.2" y="692.2" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#e3b341" font-weight="700">decided   </tspan><tspan fill="#e6edf3">D1 Post a release note to the team  you approved · posted to the demo outbox</tspan></text></g></svg>
